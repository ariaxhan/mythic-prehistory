# =============================================================================
# Mythic Prehistory -- settings the pack depends on.
#
# These are re-enforced on every boot by render_properties.py rather than merely
# seeded once, so they cannot silently drift. Values that are operator policy
# (view distance, max players, whitelist) come from fly.toml [env] and override
# what is written here.
# =============================================================================

# Forge modded server. Never flip this on without regenerating the world.
level-type=minecraft\:normal
level-name=world

# Online mode stays ON: accounts are authenticated against Mojang even when the
# whitelist is open. Turning this off would let anyone join as anyone.
online-mode=true

# This pack is entity-heavy -- six creature mods plus fish mods. Entity count is
# what costs TPS here, not block count, so simulation distance is the real lever.
view-distance=8
simulation-distance=6
max-players=4
spawn-protection=0

# Modded worldgen (Terralith + Tectonic) needs the extra structure spread.
allow-nether=true
allow-flight=true
generate-structures=true

# Keep the world alive while a player is offline but the server is up, so
# machines and farms behave the way players expect between sessions.
sync-chunk-writes=false

# Quality of life for a two-player server.
pvp=false
difficulty=normal
gamemode=survival
force-gamemode=false
enable-command-block=true

motd=Mythic Prehistory -- gods, giants, and very old bones

# Watchdog: a single tick that exceeds this is treated as a hang and the server
# KILLS ITSELF. Heavy modded worldgen (Terralith+Tectonic+structure mods) can
# legitimately block a tick for over a minute when a teleport lands in fresh
# terrain, so the watchdog turned slow-but-recoverable lag into a crash loop
# that discarded the generated chunks each time. Disabled; the supervisor still
# has real crash-loop protection.
max-tick-time=-1
